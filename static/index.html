<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANLI R2 — NLI Classifier</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fafbfc;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .container { width: 100%; max-width: 680px; }

  /* Header */
  .header { margin-bottom: 36px; }

  h1 {
    font-size: 1.65rem;
    font-weight: 700;
    color: #111;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }

  .badge-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 0.75rem;
    font-weight: 500;
    background: #f0f1f3;
    color: #555;
    border: 1px solid #e5e7eb;
  }

  .badge.accent { background: #eef2ff; color: #4361ee; border-color: #c7d2fe; }

  .badge a {
    color: inherit;
    text-decoration: none;
  }

  .badge a:hover { text-decoration: underline; }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; }

  /* Form */
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #e0e2e7;
    border-radius: 10px;
    background: #fff;
    color: #1a1a2e;
    font-size: 0.92rem;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    resize: vertical;
    min-height: 76px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  textarea:focus {
    outline: none;
    border-color: #4361ee;
    box-shadow: 0 0 0 3px rgba(67,97,238,0.08);
  }

  textarea::placeholder { color: #bbb; }

  .input-group { margin-bottom: 18px; }

  /* Examples */
  .examples-label {
    font-size: 0.78rem;
    color: #999;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .examples {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .example-btn {
    padding: 6px 14px;
    border: 1.5px solid #e0e2e7;
    border-radius: 100px;
    background: #fff;
    color: #666;
    font-size: 0.8rem;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }

  .example-btn:hover {
    border-color: #4361ee;
    color: #4361ee;
    background: #f5f7ff;
    transform: translateY(-1px);
  }

  /* Predict button */
  .predict-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #4361ee;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(67,97,238,0.2);
  }

  .predict-btn:hover { background: #3a56d4; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(67,97,238,0.25); }
  .predict-btn:active { transform: translateY(0); }
  .predict-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Spinner */
  .spinner {
    display: none;
    margin: 28px auto;
    width: 32px;
    height: 32px;
    border: 2.5px solid #e5e7eb;
    border-top-color: #4361ee;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .spinner.active { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result card */
  .result-card {
    display: none;
    margin-top: 28px;
    border: 1.5px solid #e0e2e7;
    border-radius: 14px;
    background: #fff;
    padding: 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    animation: slideUp 0.3s ease;
  }

  .result-card.visible { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f0f1f3;
  }

  .result-label {
    font-size: 1.4rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .result-label.entailment { color: #059669; }
  .result-label.neutral    { color: #71717a; }
  .result-label.contradiction { color: #dc2626; }

  .result-confidence {
    font-size: 0.85rem;
    color: #999;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* Probability bars */
  .bar-group { margin-bottom: 14px; }

  .bar-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    margin-bottom: 5px;
  }

  .bar-name { color: #555; font-weight: 500; }
  .bar-value { color: #999; font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; }

  .bar-track {
    width: 100%;
    height: 8px;
    background: #f0f1f3;
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .bar-fill.entailment     { background: linear-gradient(90deg, #34d399, #059669); }
  .bar-fill.neutral        { background: linear-gradient(90deg, #d4d4d8, #a1a1aa); }
  .bar-fill.contradiction  { background: linear-gradient(90deg, #fca5a5, #dc2626); }

  .inference-time {
    text-align: right;
    font-size: 0.75rem;
    color: #bbb;
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Error */
  .error-msg {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    background: #fef2f2;
    border: 1.5px solid #fecaca;
    color: #dc2626;
    font-size: 0.88rem;
  }

  .error-msg.visible { display: block; }

  /* Footer */
  .footer {
    margin-top: 48px;
    text-align: center;
    font-size: 0.78rem;
    color: #bbb;
  }

  .footer a { color: #4361ee; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* Keyboard hint */
  kbd {
    display: inline-block;
    padding: 1px 5px;
    font-size: 0.7rem;
    font-family: 'JetBrains Mono', monospace;
    color: #999;
    background: #f0f1f3;
    border: 1px solid #e0e2e7;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>NLI Classifier</h1>
    <div class="badge-row">
      <span class="badge"><span class="dot"></span> DeBERTa-v3-base</span>
      <span class="badge">ANLI Round 2</span>
      <span class="badge accent"><a href="/presentation">Presentation</a></span>
      <span class="badge accent"><a href="/docs" target="_blank">API Docs</a></span>
    </div>
  </div>

  <div class="input-group">
    <label for="premise">Premise</label>
    <textarea id="premise" placeholder="A factual passage from a source text..."></textarea>
  </div>

  <div class="input-group">
    <label for="hypothesis">Hypothesis</label>
    <textarea id="hypothesis" rows="2" placeholder="A claim to classify against the premise..."></textarea>
  </div>

  <p class="examples-label">Try an example:</p>
  <div class="examples" id="examples"></div>

  <button class="predict-btn" id="predictBtn" onclick="predict()">
    Classify &nbsp;<kbd>Ctrl+Enter</kbd>
  </button>

  <div class="spinner" id="spinner"></div>
  <div class="error-msg" id="error"></div>

  <div class="result-card" id="result">
    <div class="result-top">
      <div class="result-label" id="resultLabel"></div>
      <div class="result-confidence" id="resultConf"></div>
    </div>

    <div class="bar-group">
      <div class="bar-header">
        <span class="bar-name">Entailment</span>
        <span class="bar-value" id="valE">0.0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill entailment" id="barE"></div></div>
    </div>

    <div class="bar-group">
      <div class="bar-header">
        <span class="bar-name">Neutral</span>
        <span class="bar-value" id="valN">0.0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill neutral" id="barN"></div></div>
    </div>

    <div class="bar-group">
      <div class="bar-header">
        <span class="bar-name">Contradiction</span>
        <span class="bar-value" id="valC">0.0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill contradiction" id="barC"></div></div>
    </div>

    <div class="inference-time" id="timing"></div>
  </div>

  <div class="footer">
    Adversarial NLI Round 2 &middot; 54.6% test accuracy &middot;
    <a href="/presentation">View full project presentation</a>
  </div>
</div>

<script>
const EXAMPLES = [
  { name: "Entailment", premise: "The Parma trolleybus system comprises four urban routes.", hypothesis: "The trolleybus system has over 2 urban routes." },
  { name: "Contradiction", premise: "She moved to Paris in 2010.", hypothesis: "She has never lived in France." },
  { name: "Neutral", premise: "She moved to Paris in 2010.", hypothesis: "She enjoyed living in Paris." },
  { name: "Numerical", premise: "The company reported revenue of $4.2 billion in Q3, up from $3.8 billion the previous quarter.", hypothesis: "The company's revenue decreased in Q3." },
  { name: "World Knowledge", premise: "Gabriel Julio Fernández Capello was born on October 24, 1964 in Buenos Aires, Argentina.", hypothesis: "Gabriel was born in South America." }
];

const exDiv = document.getElementById("examples");
EXAMPLES.forEach(ex => {
  const btn = document.createElement("button");
  btn.className = "example-btn";
  btn.textContent = ex.name;
  btn.onclick = () => {
    document.getElementById("premise").value = ex.premise;
    document.getElementById("hypothesis").value = ex.hypothesis;
    predict();
  };
  exDiv.appendChild(btn);
});

async function predict() {
  const premise = document.getElementById("premise").value.trim();
  const hypothesis = document.getElementById("hypothesis").value.trim();
  if (!premise || !hypothesis) return;

  document.getElementById("predictBtn").disabled = true;
  document.getElementById("spinner").classList.add("active");
  document.getElementById("result").classList.remove("visible");
  document.getElementById("error").classList.remove("visible");

  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ premise, hypothesis })
    });
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();

    const labelEl = document.getElementById("resultLabel");
    labelEl.textContent = data.label;
    labelEl.className = "result-label " + data.label;

    document.getElementById("resultConf").textContent =
      (data.confidence * 100).toFixed(1) + "% confidence";

    const p = data.probabilities;
    document.getElementById("barE").style.width = (p.entailment * 100) + "%";
    document.getElementById("barN").style.width = (p.neutral * 100) + "%";
    document.getElementById("barC").style.width = (p.contradiction * 100) + "%";
    document.getElementById("valE").textContent = (p.entailment * 100).toFixed(1) + "%";
    document.getElementById("valN").textContent = (p.neutral * 100).toFixed(1) + "%";
    document.getElementById("valC").textContent = (p.contradiction * 100).toFixed(1) + "%";

    document.getElementById("timing").textContent = data.inference_time_ms.toFixed(0) + "ms";

    document.getElementById("result").classList.add("visible");
  } catch (err) {
    const errEl = document.getElementById("error");
    errEl.textContent = err.message;
    errEl.classList.add("visible");
  } finally {
    document.getElementById("predictBtn").disabled = false;
    document.getElementById("spinner").classList.remove("active");
  }
}

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") predict();
});
</script>
</body>
</html>
